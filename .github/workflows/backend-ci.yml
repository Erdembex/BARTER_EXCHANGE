name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'takkas-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'takkas-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: takkas
          POSTGRES_USER: takkas
          POSTGRES_PASSWORD: takkas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takkas -d takkas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: takkas-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: test
