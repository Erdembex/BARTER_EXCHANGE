spring:
  application:
    name: takkas-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/takkas}
    username: ${DB_USER:takkas}
    password: ${DB_PASS:takkas}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    access-token-expiry-ms: 900000
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@bex.dev}
    password: ${ADMIN_PASSWORD:Admin123!}
  upload:
    dir: ${UPLOAD_DIR:uploads}
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
  default-produces-media-type: application/json